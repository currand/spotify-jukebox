# Optional Cloudflare Tunnel overlay — use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# Or: bun run docker:up:cloudflare
#
# Removes the published host port (tunnel is the only public entry) and starts cloudflared.

services:
  jukebox:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file:
      - .env.cloudflared
    depends_on:
      - jukebox
