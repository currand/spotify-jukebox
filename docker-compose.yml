# Jukebox — pick one profile:
#
#   docker compose --profile local up --build -d
#     Simplest: port on HOST_BIND (default 127.0.0.1). Use with Tailscale on the
#     host, a reverse proxy, or LAN (set HOST_BIND=0.0.0.0 in project .env).
#
#   docker compose --profile cloudflare up --build -d
#     No host ports — Cloudflare Tunnel only (.env.cloudflared).
#
#   docker compose --profile tailscale up --build -d
#     No host ports — Tailscale sidecar only (.env.tailscale).
#

x-jukebox-app: &jukebox-app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${JUKEBOX_IMAGE:-jukebox:local}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - jukebox-data:/data
  env_file:
    - path: .env.production
      required: false
  environment: &jukebox-env
    NODE_ENV: production
    JUKEBOX_ENV: production
    BIND_HOST: "0.0.0.0"
    PORT: "3000"
    DATABASE_PATH: /data/jukebox.db

services:
  jukebox:
    <<: *jukebox-app
    profiles: [local]
    ports:
      - "${HOST_BIND:-127.0.0.1}:${JUKEBOX_PORT:-3000}:3000"
    environment:
      <<: *jukebox-env

  jukebox-internal:
    <<: *jukebox-app
    profiles: [cloudflare]
    environment:
      <<: *jukebox-env
    networks:
      jukebox-net:
        aliases: [jukebox]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env.cloudflared
        required: false
    depends_on:
      - jukebox-internal
    networks:
      - jukebox-net

  tailscale:
    image: tailscale/tailscale:latest
    profiles: [tailscale]
    hostname: jukebox
    restart: unless-stopped
    # NET_ADMIN + SYS_MODULE are required to configure the tun interface and
    # give jukebox-tailscale (network_mode: service:tailscale) a routable
    # Tailscale IP — see docs/SECURITY.md § Container hardening.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun

  jukebox-tailscale:
    <<: *jukebox-app
    profiles: [tailscale]
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      <<: *jukebox-env

networks:
  jukebox-net:

volumes:
  jukebox-data:
  tailscale-state:
