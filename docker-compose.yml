services:
  jukebox:
    build: .
    restart: unless-stopped
    ports:
      - "${JUKEBOX_PORT:-3000}:3000"
    volumes:
      - jukebox-data:/data
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      JUKEBOX_ENV: production
      DATABASE_PATH: /data/jukebox.db
      PORT: 3000

volumes:
  jukebox-data:
