# Jukebox — pick one profile:
#
#   docker compose --profile local up -d
#     Simplest: port on HOST_BIND (default 127.0.0.1). Use with Tailscale on the
#     host, a reverse proxy, or LAN (set HOST_BIND=0.0.0.0 in project .env).
#
#   docker compose --profile cloudflare up -d
#     No host ports — Cloudflare Tunnel only (.env.cloudflared).
#
#   docker compose --profile tailscale up -d
#     No host ports — Tailscale sidecar + MagicDNS HTTPS (.env.tailscale).
#
# Pulls currand/spotify-jukebox:latest from Docker Hub by default.
# Override with JUKEBOX_IMAGE in project .env, or run `docker compose pull` to update.

x-jukebox-app: &jukebox-app
  image: ${JUKEBOX_IMAGE:-currand/spotify-jukebox:latest}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - jukebox-data:/data
  env_file:
    - path: .env.production
      required: false
  environment: &jukebox-env
    NODE_ENV: production
    JUKEBOX_ENV: production
    BIND_HOST: "0.0.0.0"
    PORT: "3000"
    DATABASE_PATH: /data/jukebox.db

services:
  jukebox:
    <<: *jukebox-app
    profiles: [local]
    ports:
      - "${HOST_BIND:-127.0.0.1}:${JUKEBOX_PORT:-3000}:3000"
    environment:
      <<: *jukebox-env

  jukebox-internal:
    <<: *jukebox-app
    profiles: [cloudflare]
    environment:
      <<: *jukebox-env
    networks:
      jukebox-net:
        aliases: [jukebox]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env.cloudflared
        required: false
    depends_on:
      - jukebox-internal
    networks:
      - jukebox-net

  tailscale:
    image: tailscale/tailscale:latest
    profiles: [tailscale]
    hostname: ${TS_HOSTNAME:-jukebox}
    restart: unless-stopped
    # NET_ADMIN + SYS_MODULE are required to configure the tun interface and
    # give jukebox-tailscale (network_mode: service:tailscale) a routable
    # Tailscale IP — see docs/SECURITY.md § Container hardening.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/tailscale-serve:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  jukebox-tailscale:
    <<: *jukebox-app
    profiles: [tailscale]
    network_mode: service:tailscale
    env_file:
      - path: .env.production
        required: false
      - path: .env.tailscale
        required: false
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      <<: *jukebox-env

networks:
  jukebox-net:

volumes:
  jukebox-data:
  tailscale-state:
